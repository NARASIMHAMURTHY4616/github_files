function resetLetter(){$('#env').classList.remove('open');$('#lc').classList.remove('show');$('#ol').style.display=''}
function resetNotes(){$$('.note').forEach(n=>n.classList.remove('top'))}
function resetGift(){$('#gbox').classList.remove('open','shake');$('#rays').classList.remove('on');$('#gm').classList.remove('show');$('#gh').style.display=''}
/* =================== WISHES SCENE (stars from CONFIG.wishes) =================== */
const WPOS=[[22,30],[74,30],[48,48],[24,64],[72,62]];
function loadWishes(){
 const sky=$('#sky');$('#wc').textContent='tap a star ✦';$('#sheet').classList.add('star');$$('.ws').forEach(x=>x.classList.remove('lit'));
 sky.innerHTML=CONFIG.wishes.map((w,i)=>{const p=WPOS[i%WPOS.length];return `<button class="ws" style="left:${p[0]}%;top:${p[1]}%;--d:${(i%7)*.4}s" data-i="${i}" aria-label="Open wish ${i+1}">${G.sp}</button>`}).join('');
 sky.onclick=e=>{const b=e.target.closest('.ws');if(!b)return;$$('.ws').forEach(x=>x.classList.toggle('lit',x===b));
  const sh=$('#sheet');sh.classList.add('star');void sh.offsetWidth;$('#sm').textContent=CONFIG.wishes[+b.dataset.i];$('#sd').textContent='a wish for you ✦';sh.classList.remove('star');const r=b.getBoundingClientRect();sparkle(r.left+r.width/2,r.top+r.height/2)}}
/* =================== WRITE A WISH (Formspree) =================== */
const SENDTXT='Send My Wish Into the Universe ✦',sleep=ms=>new Promise(r=>setTimeout(r,ms));
function resetWrite(){$('#book').style.display='';$('#fold').className='fold';$('#done').classList.remove('show');$('#wm').textContent='';$('#wt').value='';$('#wn').textContent='0 / 400';const b=$('#wsend');b.disabled=false;b.textContent=SENDTXT}
async function sendWish(){
 const msg=$('#wt').value.trim().slice(0,400),m=$('#wm'),btn=$('#wsend');
 if(btn.disabled)return;
 if(!msg){m.textContent='Write your wish first ✦';return}
 btn.disabled=true;btn.textContent='Sending your wish…';m.textContent='';
 let ok=false;const ac=new AbortController(),to=setTimeout(()=>ac.abort(),15000);
 try{const r=await fetch(CONFIG.formspree.endpoint,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({message:msg,_subject:CONFIG.formspree.subject}),signal:ac.signal});ok=r.ok}catch(e){ok=false}
 clearTimeout(to);
 if(!ok){m.textContent='Oh no, your wish couldn\'t be sent just now. Please check your connection and try again 💙';btn.disabled=false;btn.textContent=SENDTXT;return}
 /* Formspree confirmed: only now play the success animation */
 const f=$('#fold');f.textContent=msg;f.className='fold show';$('#book').style.display='none';
 await sleep(1500);f.classList.add('go');await sleep(1200);f.classList.add('fly');confetti(30);await sleep(1700);
 f.className='fold';$('#dt').textContent='Your wish is now somewhere among the stars. May it find its way to you. ✨';$('#done').classList.add('show');confetti(60);
 $('#wt').value='';$('#wn').textContent='0 / 400';btn.disabled=false;btn.textContent=SENDTXT}
/* =================== MEMORIES SLIDESHOW =================== */
const MEM={i:0,play:true,t:0};
function memShow(i){const n=CONFIG.memories.length,end=i>=n;MEM.i=i;
 $$('#s-memories .ms').forEach((x,k)=>x.classList.toggle('on',k===i));$$('#mdots i').forEach((d,k)=>d.classList.toggle('a',k===i));
 if(!end)$('#mcap').textContent=CONFIG.memories[i].caption;
 $('#mend').classList.toggle('show',end);if(end)confetti(40);memSched()}
function memSched(){clearTimeout(MEM.t);if(MEM.play&&cur==='memories'&&MEM.i<CONFIG.memories.length)MEM.t=setTimeout(()=>memShow(MEM.i+1),4500)}
function memStart(){MEM.play=true;const p=$('#mpp');p.textContent='❚❚';p.setAttribute('aria-label','Pause slideshow');memShow(0)}
function wireMem(){const n=CONFIG.memories.length;
 $('#mprev').onclick=()=>memShow(MEM.i<=0?n-1:MEM.i-1);
 $('#mnext').onclick=()=>memShow(MEM.i>=n?0:MEM.i+1);
 $('#mpp').onclick=()=>{MEM.play=!MEM.play;const p=$('#mpp');p.textContent=MEM.play?'❚❚':'▶';p.setAttribute('aria-label',MEM.play?'Pause slideshow':'Play slideshow');memSched()};
 $('#mre').onclick=memStart;
 let x0=null;const pl=$('.mpol');pl.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
 pl.addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(d)>40)(d<0?$('#mnext'):$('#mprev')).click()})}
/* =================== FX CANVAS =================== */
let P=[],raf=0;const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
function loop(){const c=$('#fx');if(!c)return;const x=c.getContext('2d'),r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);if(c.width!==Math.round(r.width*d)){c.width=Math.round(r.width*d);c.height=Math.round(r.height*d)}
 x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,r.width,r.height);
 for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.a+=p.va;p.l-=.008;if(p.l<=0||p.y>r.height+20){P.splice(i,1);continue}
  x.globalAlpha=Math.min(1,p.l*2);x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);if(p.s)x.fillRect(-p.w/2,-p.h/2,p.w,p.h);else{x.beginPath();x.arc(0,0,2,0,7);x.fill()}x.restore()}
 raf=P.length?requestAnimationFrame(loop):0}
const COL=['#C9ECFF','#58A6FF','#2563EB','#fff','#D5E0F0','#153C91'];
function confetti(n){if(RM)n=Math.min(n,15);if(P.length>220)return;const w=app.clientWidth;for(let i=0;i<n;i++)P.push({x:Math.random()*w,y:-10,vx:(Math.random()-.5)*2,vy:1+Math.random()*2.5,g:.03,a:0,va:(Math.random()-.5)*.3,l:2,w:5+Math.random()*5,h:8+Math.random()*6,c:COL[Math.random()*6|0],s:1});if(!raf)raf=requestAnimationFrame(loop)}
function sparkle(px,py){if(RM)return;const r=app.getBoundingClientRect(),x=px-r.left,y=py-r.top;for(let i=0;i<14;i++){const a=Math.random()*6.28,v=1+Math.random()*3;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.04,a:0,va:0,l:.9,c:COL[Math.random()*4|0],s:0})}if(!raf)raf=requestAnimationFrame(loop)}
/* =================== START =================== */
ti=setInterval(tick,250);tick();
if(new URLSearchParams(location.search).get('preview')===CONFIG.previewKey)unlock();
